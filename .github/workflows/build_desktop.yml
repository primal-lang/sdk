name: Build Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: primal-linux-x86-64
          - os: macos-latest
            target: primal-macos-arm64
          - os: windows-latest
            target: primal-windows-x86-64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # Only the tests tagged 'cli' run here: they cover the entrypoint, the
      # dart:io platform layer and the installer, which are the parts whose
      # behaviour actually differs per platform. The rest of the suite is
      # platform-agnostic and is covered by the Linux run alone.
      - name: Test
        run: dart test -t cli

      # The committed binaries in bin/ are removed first so a failed compilation
      # can never cause a stale binary to be uploaded as the artifact.
      - name: Build
        shell: bash
        run: |
          rm -f "bin/${{ matrix.target }}"
          bash scripts/build_desktop.sh

      # Run against the artifact itself, before it is uploaded: ahead-of-time
      # compilation can break what 'dart run' never exercises, and a binary
      # that fails here must not become a release asset.
      - name: Test binary
        run: dart test test/compiler/binary_test.dart
        env:
          PRIMAL_BINARY: bin/${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.target }}
          if-no-files-found: error
